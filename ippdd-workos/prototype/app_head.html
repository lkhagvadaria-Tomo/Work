<title>IPPDD WorkOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  /* ============================================================
     IPPDD WorkOS (прототип) — Нэткапиталын Эх үүсвэрийн порталтай
     нэг брэнд систем: Manrope + JetBrains Mono, indigo/teal token.
     ============================================================ */
  :root{
    --font-body:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
    --bg:#f3f4f0;
    --bg-glow:radial-gradient(1100px 540px at 88% -10%, rgba(20,74,143,.06), transparent 62%),
              radial-gradient(760px 460px at -4% 112%, rgba(10,125,114,.05), transparent 60%);
    --bg-dots:radial-gradient(rgba(46,49,146,.055) 1px, transparent 1.4px);
    --surface:#ffffff; --surface-2:#f6f7f3; --surface-3:#ebede6;
    --border:#e1e3da; --border-strong:#c6cabb;
    --text:#182430; --muted:#4f5d6d; --faint:#7f8d9b;
    --brand:#2e3192; --brand-strong:#232577; --brand-soft:rgba(46,49,146,.08);
    --gold:#0a7d72; --gold-soft:rgba(10,125,114,.10);
    --good:#1c7a52; --good-soft:rgba(28,122,82,.10);
    --warn:#93621a; --warn-soft:rgba(147,98,26,.12);
    --danger:#b3362c; --danger-soft:rgba(179,54,44,.08);
    --ring:rgba(46,49,146,.35);
    --shadow:0 10px 32px rgba(24,36,48,.09);
    --shadow-lg:0 24px 64px rgba(24,36,48,.16);
    --grad:linear-gradient(135deg,#232577 0%,#3b3fae 48%,#0a7d72 135%);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0c131d;
      --bg-glow:radial-gradient(1100px 540px at 88% -10%, rgba(143,180,220,.06), transparent 62%),
                radial-gradient(760px 460px at -4% 112%, rgba(63,198,183,.05), transparent 60%);
      --bg-dots:radial-gradient(rgba(157,163,242,.06) 1px, transparent 1.4px);
      --surface:#111b28; --surface-2:#0e1622; --surface-3:#182434;
      --border:#223041; --border-strong:#33455b;
      --text:#e8ecf0; --muted:#96a3b2; --faint:#5f6d7d;
      --brand:#9da3f2; --brand-strong:#c0c4f7; --brand-soft:rgba(157,163,242,.13);
      --gold:#3fc6b7; --gold-soft:rgba(63,198,183,.13);
      --good:#4cc491; --good-soft:rgba(76,196,145,.12);
      --warn:#d9a94a; --warn-soft:rgba(217,169,74,.13);
      --danger:#e0796f; --danger-soft:rgba(224,121,111,.12);
      --ring:rgba(157,163,242,.4);
      --shadow:0 14px 40px rgba(0,0,0,.45);
      --shadow-lg:0 28px 72px rgba(0,0,0,.55);
      --grad:linear-gradient(135deg,#2c2f86 0%,#4d53c4 48%,#0e8578 135%);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c131d;
    --bg-glow:radial-gradient(1100px 540px at 88% -10%, rgba(143,180,220,.06), transparent 62%),
              radial-gradient(760px 460px at -4% 112%, rgba(63,198,183,.05), transparent 60%);
    --bg-dots:radial-gradient(rgba(157,163,242,.06) 1px, transparent 1.4px);
    --surface:#111b28; --surface-2:#0e1622; --surface-3:#182434;
    --border:#223041; --border-strong:#33455b;
    --text:#e8ecf0; --muted:#96a3b2; --faint:#5f6d7d;
    --brand:#9da3f2; --brand-strong:#c0c4f7; --brand-soft:rgba(157,163,242,.13);
    --gold:#3fc6b7; --gold-soft:rgba(63,198,183,.13);
    --good:#4cc491; --good-soft:rgba(76,196,145,.12);
    --warn:#d9a94a; --warn-soft:rgba(217,169,74,.13);
    --danger:#e0796f; --danger-soft:rgba(224,121,111,.12);
    --ring:rgba(157,163,242,.4);
    --shadow:0 14px 40px rgba(0,0,0,.45);
    --shadow-lg:0 28px 72px rgba(0,0,0,.55);
    --grad:linear-gradient(135deg,#2c2f86 0%,#4d53c4 48%,#0e8578 135%);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0; background:var(--bg); background-image:var(--bg-glow),var(--bg-dots);
    background-size:auto,auto,26px 26px; background-attachment:fixed;
    color:var(--text); font:14.5px/1.6 var(--font-body); -webkit-font-smoothing:antialiased; min-height:100vh}
  .mono{font-family:var(--font-mono); font-size:12px; font-weight:600; white-space:nowrap}
  .num{font-variant-numeric:tabular-nums; white-space:nowrap}
  button{font:inherit; color:inherit; cursor:pointer}
  input,textarea,select{font:inherit; color:var(--text)}
  :is(button,input,textarea,select,a):focus-visible{outline:2px solid var(--ring); outline-offset:2px; border-radius:8px}
  @keyframes popIn{from{opacity:0; transform:scale(.97) translateY(6px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important; transition:none!important} }

  /* ---------- login ---------- */
  #login{min-height:100vh; display:grid; grid-template-columns:1.05fr 1fr}
  @media (max-width:880px){ #login{grid-template-columns:1fr} .login-brand{min-height:0!important; padding:34px 28px!important} .login-brand .vals{display:none} }
  .login-brand{background-image:radial-gradient(900px 480px at 110% -14%, rgba(0,167,157,.16), transparent 55%),
    linear-gradient(158deg,#1d1f66 0%, #2e3192 56%, #232577 100%);
    color:#eef3f8; padding:clamp(38px,6vw,80px); display:flex; flex-direction:column; justify-content:space-between; gap:40px}
  .lb-top{display:flex; align-items:center; gap:13px}
  .lb-top .mark{width:42px; height:42px; border-radius:11px; background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:19px; color:#6fdccf}
  .lb-top .w1{font-size:13.5px; font-weight:700; letter-spacing:.04em}
  .lb-top .w2{font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:rgba(238,243,248,.55); margin-top:2px}
  .lb-mid .eyebrow{font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#56d6c8; margin-bottom:16px; font-weight:600}
  .lb-mid h1{font-weight:600; font-size:clamp(26px,3.2vw,40px); line-height:1.2; margin:0 0 14px; letter-spacing:-.01em; text-wrap:balance}
  .lb-mid p{color:rgba(238,243,248,.72); font-size:14.5px; line-height:1.7; max-width:46ch; margin:0}
  .vals{display:flex; flex-direction:column; gap:12px}
  .vals .v{display:flex; gap:11px; align-items:baseline; font-size:13.5px; color:rgba(238,243,248,.8)}
  .vals .v .tick{color:#56d6c8; flex:none; font-weight:700}
  .vals .v b{color:#fff; font-weight:600}
  .lb-foot{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:rgba(238,243,248,.42)}
  .login-side{display:flex; align-items:center; justify-content:center; padding:40px clamp(22px,5vw,64px)}
  .login-card{width:min(430px,100%)}
  .proto-badge{display:inline-block; margin-bottom:20px; padding:4px 12px; border-radius:99px; font-size:10.5px; letter-spacing:.09em;
    color:var(--gold); background:var(--gold-soft); border:1px solid var(--border); text-transform:uppercase; font-weight:600}
  .login-card h2{font-size:25px; font-weight:600; margin:0 0 8px; letter-spacing:-.01em}
  .login-card .sub{color:var(--muted); font-size:13.5px; line-height:1.65; margin:0 0 22px; max-width:42ch}
  .acct-box{border:1px solid var(--border); border-radius:13px; background:var(--surface); overflow:hidden; box-shadow:var(--shadow)}
  .acct-box .ph{padding:11px 16px; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; font-weight:600;
    color:var(--faint); background:var(--surface-2); border-bottom:1px solid var(--border)}
  .acct{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:none;
    padding:13px 16px; border-bottom:1px solid var(--border); transition:background .12s}
  .acct:last-of-type{border-bottom:none}
  .acct:hover{background:var(--brand-soft)}
  .acct .av{width:36px; height:36px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:700; font-size:14px; background:var(--brand)}
  .acct.adm .av{background:var(--gold)}
  .acct .an{font-size:13.5px; font-weight:600}
  .acct .ae{font-size:11px; color:var(--faint)}
  .acct .role{margin-left:auto; font-size:10px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; border-radius:99px; padding:3px 10px}
  .acct .role.a{color:var(--gold); background:var(--gold-soft)}
  .acct .role.u{color:var(--brand); background:var(--brand-soft)}
  .picker-note{font-size:11.5px; color:var(--faint); line-height:1.6; padding:11px 16px; background:var(--surface-2); border-top:1px solid var(--border)}
  .login-card .foot{margin-top:20px; font-size:11.5px; color:var(--faint); line-height:1.6}

  /* ---------- app shell: зүүн sidebar (desktop) + доод таб (mobile) ---------- */
  #app{min-height:100vh}
  #sideNav{display:none}
  @media (min-width:1000px){
    #app{padding-left:236px}
    #sideNav{display:flex; flex-direction:column; position:fixed; left:0; top:0; bottom:0; width:236px; z-index:45;
      background:var(--surface); border-right:1px solid var(--border); padding:20px 14px 16px; gap:5px}
  }
  .sn-brand{display:flex; align-items:center; gap:11px; padding:0 8px 16px; border-bottom:1px solid var(--border); margin-bottom:12px}
  .sn-brand .logo2{width:38px; height:38px; border-radius:10px; flex:none; background:linear-gradient(150deg,#1d1f66,#2e3192);
    display:flex; align-items:center; justify-content:center; color:#6fdccf; font-weight:800; font-size:16px}
  .sn-brand b{font-size:13.5px; display:block; line-height:1.25}
  .sn-brand span{font-size:9px; color:var(--faint); letter-spacing:.1em; text-transform:uppercase}
  nav.views{display:flex; flex-direction:column; gap:4px}
  nav.views button{display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:none; background:none;
    border-radius:10px; padding:11px 13px; font-size:14px; font-weight:600; color:var(--muted);
    transition:background .12s, color .12s; position:relative}
  nav.views button:hover{background:var(--surface-2); color:var(--text)}
  nav.views button[aria-selected="true"]{background:var(--grad); color:#fff; font-weight:700;
    box-shadow:0 6px 16px color-mix(in srgb, #232577 25%, transparent)}
  nav.views button .cnt{margin-left:auto; min-width:19px; height:19px; border-radius:99px; background:var(--danger); color:#fff;
    font-size:11px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; padding:0 6px}
  .sn-foot{margin-top:auto; border-top:1px solid var(--border); padding-top:12px; display:flex; flex-direction:column; gap:10px}
  .sn-user{display:flex; align-items:center; gap:10px; padding:0 6px}
  .sn-user .uav{width:32px; height:32px; border-radius:50%; background:var(--brand); color:#fff; font-size:13px; font-weight:700;
    display:flex; align-items:center; justify-content:center; flex:none}
  .sn-user b{font-size:12.5px; display:block; line-height:1.2}
  .sn-user span{font-size:10.5px; color:var(--faint)}
  .sn-actions{display:flex; gap:8px; padding:0 4px}
  .sn-actions button{flex:1; border:1px solid var(--border); background:var(--surface-2); border-radius:9px; padding:8px 0;
    font-size:12px; font-weight:600; color:var(--muted); display:flex; align-items:center; justify-content:center; gap:6px}
  .sn-actions button:hover{color:var(--text); border-color:var(--border-strong)}
  .sn-note{font-size:10px; color:var(--faint); line-height:1.5; padding:0 6px}

  @media (max-width:999px){
    nav.views{position:fixed; left:0; right:0; bottom:0; z-index:46; flex-direction:row; justify-content:space-around;
      border-top:1px solid var(--border); background:var(--surface); padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
    nav.views button{flex-direction:column; gap:3px; width:auto; padding:5px 9px; font-size:9.5px; border-radius:8px}
    nav.views button[aria-selected="true"]{background:none; box-shadow:none; color:var(--brand)}
    nav.views button .cnt{position:absolute; top:-2px; right:0; margin:0}
    #sideNav .sn-brand,#sideNav .sn-foot{display:none}
    #sideNav{display:block; position:static; width:auto; padding:0; border:none; background:none}
    main{padding-bottom:96px!important}
  }

  .topbar{position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:11px clamp(16px,3vw,30px); background:color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter:blur(14px); border-bottom:1px solid var(--border)}
  .demo-chip{font-size:10.5px; letter-spacing:.07em; text-transform:uppercase; font-weight:600;
    color:var(--gold); background:var(--gold-soft); border:1px solid var(--border); border-radius:99px; padding:4px 12px}
  .conn{font-size:11.5px; color:var(--muted)}
  .conn b.on{color:var(--good)} .conn b.off{color:var(--danger)}
  .topbar .sp{flex:1}
  .userchip{display:flex; align-items:center; gap:9px; padding:4px 12px 4px 5px; border:1px solid var(--border); border-radius:99px; background:var(--surface)}
  .userchip .uav{width:26px; height:26px; border-radius:50%; background:var(--brand); color:#fff; font-size:11.5px; font-weight:700;
    display:flex; align-items:center; justify-content:center}
  .userchip .un{font-size:12px; font-weight:600; line-height:1.2}
  .userchip .ur{font-size:9.5px; color:var(--faint)}
  .icon-btn{width:34px; height:34px; border-radius:99px; border:1px solid var(--border); background:var(--surface);
    display:flex; align-items:center; justify-content:center; color:var(--muted); flex:none; font-size:15px;
    transition:color .12s, border-color .12s}
  .icon-btn:hover{color:var(--text); border-color:var(--border-strong)}
  .ghost-btn{display:flex; align-items:center; gap:6px; padding:7px 13px; border-radius:99px; border:1px solid var(--border);
    background:var(--surface); color:var(--muted); font-size:12.5px; font-weight:600}
  .ghost-btn:hover{color:var(--text); border-color:var(--border-strong)}

  main{padding:26px clamp(16px,3.5vw,34px) 90px; max-width:1120px; margin:0 auto}
  h1{font-size:clamp(20px,2.6vw,26px); font-weight:800; letter-spacing:-.02em; margin:0 0 4px; text-wrap:balance; line-height:1.2}
  h3{font-size:14px; margin:0; font-weight:700}
  .sub{color:var(--muted); margin:0 0 18px; font-size:13.5px; line-height:1.6}
  .crumb{display:inline-flex; align-items:center; gap:10px; font-size:10.5px; font-weight:600; letter-spacing:.11em;
    text-transform:uppercase; color:var(--gold); margin-bottom:10px}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:13px; margin-bottom:20px}
  .stat{background:var(--surface); border:1px solid var(--border); border-radius:15px; padding:16px 19px;
    box-shadow:0 1px 2px rgba(24,36,48,.05)}
  .stat .l{font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--faint); font-weight:600}
  .stat .v{font-size:27px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:4px; line-height:1.1}
  .stat .v.bad{color:var(--danger)} .stat .v.good{color:var(--good)}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:16px; margin-bottom:16px;
    box-shadow:0 1px 2px rgba(24,36,48,.05), 0 8px 24px rgba(24,36,48,.04)}
  .card-h{display:flex; align-items:center; gap:10px; justify-content:space-between; flex-wrap:wrap;
    padding:13px 20px; border-bottom:1px solid var(--border)}
  .card-b{padding:16px 20px}
  .chip{background:var(--surface-2); border:1px solid var(--border); color:var(--muted);
    border-radius:99px; font-size:11px; font-weight:600; padding:2px 10px; white-space:nowrap}

  .scroll{overflow-x:auto}
  table{border-collapse:collapse; width:100%}
  th{text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); padding:9px 15px; border-bottom:1px solid var(--border);
    background:color-mix(in srgb, var(--brand) 6%, var(--surface-2)); white-space:nowrap; font-weight:600}
  td{padding:9px 15px; border-bottom:1px solid var(--border); vertical-align:top; font-size:13px; line-height:1.5}
  tr:last-child td{border-bottom:none}
  tr.rowlink{cursor:pointer}
  tr.rowlink:hover td{background:color-mix(in srgb, var(--brand) 5%, var(--surface))}
  .sm{font-size:12px}
  .wrap{min-width:240px; max-width:440px}
  .late{color:var(--danger); font-weight:700}

  .badge{display:inline-flex; align-items:center; gap:4px; border-radius:99px; padding:3px 11px;
    font-size:11px; font-weight:600; letter-spacing:.02em; white-space:nowrap; border:1px solid transparent}
  .badge-pass{background:var(--good-soft); color:var(--good)}
  .badge-warn{background:var(--warn-soft); color:var(--warn)}
  .badge-fail{background:var(--danger-soft); color:var(--danger)}
  .badge-info{background:var(--brand-soft); color:var(--brand)}
  .badge-muted{background:var(--surface-2); color:var(--muted); border-color:var(--border)}

  ul.list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
  ul.list li{display:flex; justify-content:space-between; align-items:center; gap:12px;
    border:1px solid var(--border); border-radius:11px; padding:8px 13px; background:var(--surface)}
  li.block{flex-direction:column; align-items:stretch; gap:4px}
  li.block p{margin:0; color:var(--muted); font-size:12px; line-height:1.55}

  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; border:none;
    border-radius:11px; padding:10px 20px; font-size:13.5px; font-weight:700;
    background:var(--grad); color:#fff; box-shadow:0 2px 8px rgba(20,73,143,.25);
    transition:filter .15s, transform .12s}
  .btn:hover{filter:brightness(1.1)} .btn:active{transform:scale(.98)}
  .btn.sec{background:var(--surface); color:var(--text); border:1px solid var(--border-strong); box-shadow:none}
  .btn.sec:hover{border-color:var(--brand); filter:none}
  .btn.pass{background:linear-gradient(135deg,#116b47,#1c9a68)}
  .btn.warn{background:linear-gradient(135deg,#8a5c14,#b8811f)}
  .btn.fail{background:linear-gradient(135deg,#8f2b22,#c04a3f)}
  .btn.sm2{padding:6px 13px; font-size:12px; border-radius:9px}
  .btn:disabled{opacity:.45; cursor:not-allowed}

  .field{display:block; margin-bottom:10px}
  .field span{display:block; font-size:10.5px; font-weight:600; color:var(--faint); margin-bottom:5px;
    text-transform:uppercase; letter-spacing:.07em}
  input[type=text],input[type=url],input[type=date],input[type=number],select,textarea{
    width:100%; font-size:13.5px; color:var(--text); background:var(--surface-2);
    border:1px solid var(--border); border-radius:10px; padding:9px 12px; transition:border-color .12s}
  input:focus,select:focus,textarea:focus{border-color:var(--brand); outline:none}
  input::placeholder{color:var(--faint)}
  .frow{display:flex; gap:10px; flex-wrap:wrap} .frow .field{flex:1; min-width:150px}
  details.adder{border:1px dashed var(--border-strong); border-radius:12px; padding:11px 15px; margin-top:12px}
  details.adder summary{cursor:pointer; font-size:13px; font-weight:700; color:var(--brand); list-style:none}
  details.adder summary::before{content:'+ '; }
  details.adder[open] summary::before{content:'− '}
  details.adder > div{margin-top:12px}
  .grid2{display:grid; gap:16px; grid-template-columns:1fr}
  @media (min-width:980px){ .grid2{grid-template-columns:1fr 1fr} }
  .note{border:1px solid var(--border); border-left:3px solid var(--gold); background:var(--surface);
    color:var(--muted); padding:11px 16px; border-radius:0 10px 10px 0; font-size:12.5px; line-height:1.65; margin:12px 0 0}
  .toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:90;
    background:var(--text); color:var(--bg); border-radius:11px; padding:11px 20px; font-size:13.5px; font-weight:600;
    box-shadow:var(--shadow-lg); max-width:90vw; animation:popIn .2s ease both}
  .toast.err{background:var(--danger); color:#fff}
  .cert{border:1px solid var(--border); border-radius:18px; background:var(--surface);
    padding:30px 32px; max-width:640px; box-shadow:var(--shadow)}
  .cert h2{text-align:center; margin:6px 0 0; font-size:21px; font-weight:800}
  .cert .eyebrow{text-align:center; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin:0; font-weight:600}
  .cert dl{display:grid; grid-template-columns:1fr 1fr; gap:12px 22px; margin:20px 0 0}
  .cert dt{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--faint); font-weight:600}
